version: 2
models:
  - name: fct_shots_xg
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, event_id]
    columns:
      - name: game_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_games'), field: game_id}
      - name: xg
        data_tests: [not_null]
  - name: fct_team_games
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, team_id]
    columns:
      - name: game_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_games'), field: game_id}
      - name: team_id
        data_tests: [not_null]
