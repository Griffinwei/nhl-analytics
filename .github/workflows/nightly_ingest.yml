name: Nightly Ingest

on:
  schedule:
    # GitHub cron is UTC and ignores DST: 06:00 UTC = 1am EST / 2am EDT, always after late games.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to ingest (e.g. 20262027); blank = current season"
        required: false
        default: ""

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.DB_URL }}
      SEASON: ${{ github.event.inputs.season }}
      # dbt prod target (dbt/profiles/profiles.yml). score.py reads int_shot_features from DBT_SCHEMA too
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt/profiles
      DBT_HOST: ${{ secrets.DBT_HOST }}
      DBT_USER: ${{ secrets.DBT_USER }}
      DBT_PASSWORD: ${{ secrets.DBT_PASSWORD }}
      DBT_DBNAME: ${{ secrets.DBT_DBNAME }}
      DBT_SCHEMA: analytics
      # Only run tests whose parents are all being built (or already upstream of the selection). The default
      # also picks up tests on unselected models, e.g. stg_betting_lines -> stg_games when building +int_shot_features
      DBT_INDIRECT_SELECTION: buildable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # score pins the libraries the champion was pickled with; no MLflow needed to load it
      - name: Install dependencies
        # --group needs pip >= 25.1
        run: |
          python -m pip install --upgrade pip
          pip install --group score --group dbt

      - name: Ingest games
        run: python ingestion/ingest_games.py

      - name: Ingest play-by-play
        run: python ingestion/ingest_play_by_play.py

      - name: Ingest shifts
        run: python ingestion/ingest_shifts.py

      - name: Install dbt packages
        working-directory: dbt/nhl_analytics
        run: dbt deps

      # dbt build runs each model's tests before its children, so a failed test stops bad data here
      - name: Build shot features
        working-directory: dbt/nhl_analytics
        run: dbt build --select +int_shot_features --target prod

      - name: Score shots with champion xG model
        run: python -m models.xg.score

      # Marts read predictions for the version that was just scored, not dbt_project.yml's default
      - name: Build marts
        working-directory: dbt/nhl_analytics
        run: |
          version=$(jq -r .version ../../models/xg/production/metadata.json)
          dbt build --select fct_shots_xg+ --target prod --vars "{xg_model_version: '$version'}"
